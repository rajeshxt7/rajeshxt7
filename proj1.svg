<svg xmlns="http://www.w3.org/2000/svg" width="900" height="86" viewBox="0 0 900 86" role="img" aria-label="Horaa Esports">
  <title>Horaa Esports</title>
  <style>
    @keyframes arw1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,-5px); } }
    @keyframes rule1 { 0% { transform: scaleX(0); } 55%,100% { transform: scaleX(1); } }
    .ar1 { animation: arw1 2.1s ease-in-out infinite; }
    .rl1 { transform-origin: 0 0; animation: rule1 6s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.0s; }
  </style>
  <rect width="900" height="86" fill="#0d1117"/>
  <rect x="0" y="22" width="3" height="42" rx="1.5" fill="#f472b6"/>
  <text x="26" y="52" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="13" fill="#f472b6" opacity=".85">01</text>
  <text x="72" y="50" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="26" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Horaa Esports</text>
  <text x="72" y="71" font-family="'Century Gothic', Futura, 'Trebuchet MS', sans-serif" font-size="13" textLength="440" lengthAdjust="spacingAndGlyphs" fill="#8ea3c0">Roster, matches, news, sponsors and contact.</text>
  <text x="840" y="50" text-anchor="end" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="12" fill="#6b7d96">React &#183; TypeScript &#183; Tailwind</text>
  <text x="840" y="71" text-anchor="end" font-family="'Century Gothic', Futura, 'Trebuchet MS', sans-serif" font-size="11.5" letter-spacing="1.4" fill="#f472b6" opacity=".9">VIEW LIVE</text>
  <g class="ar1" transform="translate(858,30)">
    <path d="M0 10 L10 0" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 0 L10 0 L10 6" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="85" width="900" height="1" fill="#1b2637"/>
</svg>
