<svg xmlns="http://www.w3.org/2000/svg" width="288" height="66" viewBox="0 0 288 66" role="img" aria-label="Color Palette">
  <title>Color Palette</title>
  <style>
    @keyframes arw6 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,-5px); } }
    @keyframes rule6 { 0% { transform: scaleX(0); } 55%,100% { transform: scaleX(1); } }
    .ar6 { animation: arw6 2.1s ease-in-out infinite; }
    .rl6 { transform-origin: 0 0; animation: rule6 6s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 1.0s; }
  </style>
  <rect width="288" height="66" fill="#0d1117"/>
  <text x="2" y="30" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="11" fill="#a855f7" opacity=".85">06</text>
  <text x="30" y="31" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="16.5" textLength="196" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Color Palette</text>
  <text x="30" y="50" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="10" fill="#6b7d96">HSL &#183; JS &#183; CSS</text>
  <g class="ar6" transform="translate(268,14)">
    <path d="M0 9 L9 0" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 0 L9 0 L9 5" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="65" width="288" height="1" fill="#a855f7" opacity=".22"/>
</svg>
