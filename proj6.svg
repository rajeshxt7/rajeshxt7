<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="Pomodoro">
  <title>Pomodoro</title>
  <defs>
    <linearGradient id="ps5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pc5"><rect x="4" y="4" width="432" height="152" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes sww5 { 0% { transform: translateX(-220px); } 55%,100% { transform: translateX(440px); } }
    @keyframes arw5 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-4px); } }
    @keyframes brd5 { 0%,100% { stroke-opacity: .30; } 50% { stroke-opacity: .95; } }
    .sw5 { animation: sww5 4.6s cubic-bezier(.4,0,.2,1) infinite; }
    .ar5 { animation: arw5 1.9s ease-in-out infinite; }
    .bd5 { animation: brd5 3.4s ease-in-out infinite; }
  </style>

  <rect width="440" height="160" fill="#0d1117"/>
  <rect x="4" y="4" width="432" height="152" rx="14" fill="#0f1626"/>
  <rect class="bd5" x="4" y="4" width="432" height="152" rx="14" fill="none" stroke="#ef4444" stroke-width="2"/>
  <g clip-path="url(#pc5)">
    <rect class="sw5" x="0" y="4" width="220" height="152" fill="url(#ps5)"/>
  </g>

  <text x="24" y="66" font-family="'Arial Black', Gadget, sans-serif" font-size="46" fill="#ef4444" opacity=".20">06</text>
  <text x="24" y="96" font-family="'Arial Black', Gadget, sans-serif" font-size="25" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Pomodoro</text>
  <text x="24" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" textLength="330" lengthAdjust="spacingAndGlyphs" fill="#8ea3c0">25/5 focus timer with session counter.</text>

    <rect x="24" y="124" width="31" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="33" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">JS</text>
    <rect x="63" y="124" width="37" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="72" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">CSS</text>

  <g class="ar5" transform="translate(392,22)">
    <path d="M0 14 L14 0" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6 0 L14 0 L14 8" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
