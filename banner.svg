<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Rajesh Bist - front-end developer">
  <title>Rajesh Bist</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#150a22"/>
    </linearGradient>
    <linearGradient id="nmg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#8ee7ff"/>
      <stop offset="42%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9a6ff"/>
    </linearGradient>
    <linearGradient id="ldg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ulg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="nglow" x="-50%" y="-60%" width="200%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7fd7ff" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="900" height="300" fill="url(#bg3)"/>
  <ellipse cx="450" cy="170" rx="330" ry="110" fill="url(#halo)">
    <animate attributeName="opacity" values=".5;1;.5" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <g stroke="#16233a" stroke-width="1" opacity=".5">
    <path d="M0 75 H900 M0 150 H900 M0 225 H900"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300"/>
  </g>

  <!-- ══════════ STAGE 1 : terminal window ══════════ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0200;0.2800;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="60" y="48" width="780" height="158" rx="12" fill="#080e1a" fill-opacity=".92" stroke="#1e2b42"/>
    <path d="M60 78 H840" stroke="#1e2b42"/>
    <circle cx="84" cy="63" r="5" fill="#ef4444" fill-opacity=".85"/>
    <circle cx="102" cy="63" r="5" fill="#f59e0b" fill-opacity=".85"/>
    <circle cx="120" cy="63" r="5" fill="#22c55e" fill-opacity=".85"/>
    <text x="450" y="67" text-anchor="middle" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="11.5" fill="#4d5c73">rajesh@portfolio : ~ /bash</text>
      <text x="84" y="104" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="14" opacity="0" xml:space="preserve" fill="#22d3ee">$ whoami<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0300;0.2600;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="84" y="125" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="14" opacity="0" xml:space="preserve" fill="#e6edf3">rajesh_bist<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0700;0.2600;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="84" y="146" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="14" opacity="0" xml:space="preserve" fill="#22d3ee">$ cat role.txt<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1200;0.2600;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="84" y="167" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="14" opacity="0" xml:space="preserve" fill="#a3e635">front-end_developer<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1600;0.2600;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text>
      <text x="84" y="188" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="14" opacity="0" xml:space="preserve" fill="#22d3ee">$ ./run profile --live<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2000;0.2600;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text>
    <rect x="84" y="192" width="0" height="3" rx="1.5" fill="url(#ldg)">
      <animate attributeName="width" values="0;45;91;137;183;228;274;320;366;411;457;503;549;594;640;686;732;732;0" keyTimes="0.0000;0.0150;0.0300;0.0450;0.0600;0.0750;0.0900;0.1050;0.1200;0.1350;0.1500;0.1650;0.1800;0.1950;0.2100;0.2250;0.2400;0.26;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="816" y="196" text-anchor="end" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="11" fill="#4d5c73">booting 0%
      <animate attributeName="opacity" values="0" dur="14s" repeatCount="indefinite"/>
    </text>
    <rect x="84" y="104" width="9" height="15" fill="#22d3ee" opacity=".9">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 21;0 42;0 63;0 84;0 84"
        keyTimes="0;0.03;0.07;0.12;0.16;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════ STAGE 2 : DEV pill ══════════ -->
  <g transform="translate(450,96)" opacity="1">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3000;0.9300;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="-96" y="-23" width="192" height="36" rx="18" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".8"/>
    <text x="0" y="5" text-anchor="middle" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="14" letter-spacing="3.5" fill="#7fe7ff">&lt; DEV /&gt;</text>
  </g>

  <!-- ══════════ STAGE 3 : name + glitch ══════════ -->
  <g transform="translate(450,172)" opacity="1">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="0.86;1.04;1;1" keyTimes="0;0.35;0.41;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3400;0.9300;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
      <text x="-5" y="0" text-anchor="middle" font-family="Copperplate, 'Copperplate Gothic Bold', 'Century Gothic', Futura, sans-serif" font-size="58" fill="#22d3ee" opacity="0">
        RAJESH BIST
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.305;0.335;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="5" y="0" text-anchor="middle" font-family="Copperplate, 'Copperplate Gothic Bold', 'Century Gothic', Futura, sans-serif" font-size="58" fill="#f472b6" opacity="0">
        RAJESH BIST
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.32;0.34;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="0" text-anchor="middle" font-family="Copperplate, 'Copperplate Gothic Bold', 'Century Gothic', Futura, sans-serif" font-size="58"
            textLength="540" lengthAdjust="spacingAndGlyphs" fill="url(#nmg)" filter="url(#nglow)">RAJESH BIST</text>
    </g>
  </g>

  <!-- ══════════ STAGE 4 : description ══════════ -->
  <g>
    <text x="450" y="220" text-anchor="middle" font-family="'Century Gothic', Futura, 'Trebuchet MS', sans-serif" font-size="19"
          letter-spacing="5.5" fill="#a8bdd6" opacity="1">
      FRONT-END WEB DEVELOPER
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4400;0.9300;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <rect x="290" y="236" width="320" height="2" rx="1" fill="url(#ulg)" opacity="1">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4800;0.9300;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="270" text-anchor="middle" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="13"
          fill="#6b7d96" opacity="1" xml:space="preserve">
      React &#183; TypeScript &#183; Tailwind &#183; Next.js &#183; UI/UX
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5200;0.9300;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <rect x="712" y="258" width="8" height="15" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5400;0.9300;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="900" height="300" fill="url(#scan)"/>
  <rect width="900" height="300" fill="url(#vig)"/>
</svg>
