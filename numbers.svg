<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Rajesh Bist - profile numbers">
  <title>By the numbers</title>
  <defs>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="shine2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="8" y="8" width="884" height="314" rx="16"/></clipPath>
  </defs>
  <style>
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(14px); }
      10%,86% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes sweep2 { 0% { transform: translateX(-300px); } 60%,100% { transform: translateX(900px); } }
    @keyframes edge   { 0%,100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }
    .sw2 { animation: sweep2 5s cubic-bezier(.4,0,.2,1) infinite; }
    .edge { animation: edge 3.5s ease-in-out infinite; }
    .t0 { animation: rise 6s ease-in-out infinite; animation-delay: 0.0s; }
    .t1 { animation: rise 6s ease-in-out infinite; animation-delay: 0.3s; }
    .t2 { animation: rise 6s ease-in-out infinite; animation-delay: 0.7s; }
    .t3 { animation: rise 6s ease-in-out infinite; animation-delay: 1.0s; }
    .t4 { animation: rise 6s ease-in-out infinite; animation-delay: 1.4s; }
    .t5 { animation: rise 6s ease-in-out infinite; animation-delay: 1.8s; }
  </style>
  <rect width="900" height="330" fill="#0d1117"/>
  <rect class="edge" x="8" y="8" width="884" height="314" rx="16" fill="#0d1117" stroke="#1f2a3a"/>
  <g clip-path="url(#cardclip)">
    <rect class="sw2" x="0" y="8" width="300" height="314" fill="url(#shine2)" opacity=".35"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="50" font-size="22" font-weight="700" fill="url(#ttl)" letter-spacing="1">BY THE NUMBERS</text>
    <text x="870" y="50" text-anchor="end" font-size="12" fill="#5b6b85" letter-spacing="1.6">LIVE FROM GITHUB API</text>
  </g>
  <rect x="30" y="60" width="840" height="2" rx="1" fill="#1f2a3a"/>
    <g class="t0">
      <rect x="20" y="78" width="280" height="104" rx="13" fill="#121a26" stroke="#1f2a3a"/>
      <g transform="translate(40,96)"><circle cx="12" cy="8" r="4" fill="#22d3ee"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/></g>
      <text x="40" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#22d3ee">2</text>
      <text x="40" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#7d8da6">FOLLOWERS</text>
      <rect x="20" y="179" width="280" height="3" rx="1.5" fill="#22d3ee" opacity=".85"/>
    </g>
    <g class="t1">
      <rect x="310" y="78" width="280" height="104" rx="13" fill="#121a26" stroke="#1f2a3a"/>
      <g transform="translate(330,96)"><path d="M3 8l9-4 9 4v9l-9 4-9-4z" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/><path d="M3 8l9 4 9-4M12 12v9" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/></g>
      <text x="330" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#a855f7">1</text>
      <text x="330" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#7d8da6">PUBLIC REPOS</text>
      <rect x="310" y="179" width="280" height="3" rx="1.5" fill="#a855f7" opacity=".85"/>
    </g>
    <g class="t2">
      <rect x="600" y="78" width="280" height="104" rx="13" fill="#121a26" stroke="#1f2a3a"/>
      <g transform="translate(620,96)"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="#f472b6" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/></g>
      <text x="620" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f472b6">2026</text>
      <text x="620" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#7d8da6">ON GITHUB SINCE</text>
      <rect x="600" y="179" width="280" height="3" rx="1.5" fill="#f472b6" opacity=".85"/>
    </g>
    <g class="t3">
      <rect x="20" y="198" width="280" height="104" rx="13" fill="#121a26" stroke="#1f2a3a"/>
      <g transform="translate(40,216)"><circle cx="12" cy="9" r="5.5" fill="none" stroke="#22d3ee" stroke-width="2"/><path d="M9 14l-2 7 5-2.5 5 2.5-2-7" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/></g>
      <text x="40" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#22d3ee">4</text>
      <text x="40" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#7d8da6">CERTIFICATIONS</text>
      <rect x="20" y="299" width="280" height="3" rx="1.5" fill="#22d3ee" opacity=".85"/>
    </g>
    <g class="t4">
      <rect x="310" y="198" width="280" height="104" rx="13" fill="#121a26" stroke="#1f2a3a"/>
      <g transform="translate(330,216)"><rect x="3" y="3" width="7" height="7" rx="2" fill="#a855f7"/><rect x="14" y="3" width="7" height="7" rx="2" fill="#a855f7" opacity=".6"/><rect x="3" y="14" width="7" height="7" rx="2" fill="#a855f7" opacity=".6"/><rect x="14" y="14" width="7" height="7" rx="2" fill="#a855f7"/></g>
      <text x="330" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#a855f7">10+</text>
      <text x="330" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#7d8da6">TECHNOLOGIES</text>
      <rect x="310" y="299" width="280" height="3" rx="1.5" fill="#a855f7" opacity=".85"/>
    </g>
    <g class="t5">
      <rect x="600" y="198" width="280" height="104" rx="13" fill="#121a26" stroke="#1f2a3a"/>
      <g transform="translate(620,216)"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#f472b6" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="8.5" fill="none" stroke="#f472b6" stroke-width="1.5"/><path d="M3.5 12h17" stroke="#f472b6" stroke-width="1.5"/></g>
      <text x="620" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f472b6">1</text>
      <text x="620" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#7d8da6">LIVE PROJECTS</text>
      <rect x="600" y="299" width="280" height="3" rx="1.5" fill="#f472b6" opacity=".85"/>
    </g>
</svg>
