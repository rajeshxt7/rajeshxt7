<svg xmlns="http://www.w3.org/2000/svg" width="900" height="262" viewBox="0 0 900 262" role="img" aria-label="By the numbers">
  <title>By the numbers</title>
  <style>
    @keyframes dash { 0% { opacity: .35; } 50% { opacity: 1; } 100% { opacity: .35; } }
    .glowt { animation: dash 4s ease-in-out infinite; }
  </style>
  <rect width="900" height="262" fill="#0d1117"/>
  <text class="glowt" x="30" y="42" font-family="Copperplate, 'Copperplate Gothic Bold', 'Century Gothic', Futura, sans-serif" font-size="21" letter-spacing="2.2" fill="#dbe7f5">BY THE NUMBERS</text>
  <text x="870" y="42" text-anchor="end" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="11.5" letter-spacing="1.4" fill="#4d5c73">LIVE FROM GITHUB API</text>
  <rect x="30" y="54" width="840" height="1" fill="#1b2637"/>
    <g>
