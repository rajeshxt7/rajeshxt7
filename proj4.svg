<svg xmlns="http://www.w3.org/2000/svg" width="288" height="66" viewBox="0 0 288 66" role="img" aria-label="Todo List">
  <title>Todo List</title>
  <style>
    @keyframes arw4 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,-5px); } }
    @keyframes rule4 { 0% { transform: scaleX(0); } 55%,100% { transform: scaleX(1); } }
    .ar4 { animation: arw4 2.1s ease-in-out infinite; }
    .rl4 { transform-origin: 0 0; animation: rule4 6s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.0s; }
  </style>
  <rect width="288" height="66" fill="#0d1117"/>
  <text x="2" y="30" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="11" fill="#22c55e" opacity=".85">04</text>
  <text x="30" y="31" font-family="'Courier New', Courier, monospace" font-size="16.5" textLength="196" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Todo List</text>
  <text x="30" y="50" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="10" fill="#6b7d96">JS &#183; localStorage</text>
  <g class="ar4" transform="translate(268,14)">
    <path d="M0 9 L9 0" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 0 L9 0 L9 5" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="65" width="288" height="1" fill="#22c55e" opacity=".22"/>
