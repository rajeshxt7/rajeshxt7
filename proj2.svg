<svg xmlns="http://www.w3.org/2000/svg" width="900" height="86" viewBox="0 0 900 86" role="img" aria-label="Dental Care">
  <title>Dental Care</title>
  <style>
    @keyframes arw2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,-5px); } }
    @keyframes rule2 { 0% { transform: scaleX(0); } 55%,100% { transform: scaleX(1); } }
    .ar2 { animation: arw2 2.1s ease-in-out infinite; }
    .rl2 { transform-origin: 0 0; animation: rule2 6s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.5s; }
  </style>
  <rect width="900" height="86" fill="#0d1117"/>
  <rect x="0" y="22" width="3" height="42" rx="1.5" fill="#0ea5e9"/>
  <text x="26" y="52" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="13" fill="#0ea5e9" opacity=".85">02</text>
  <text x="72" y="50" font-family="'Gill Sans MT', 'Gill Sans', Calibri, sans-serif" font-size="26" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Dental Care</text>
  <text x="72" y="71" font-family="'Century Gothic', Futura, 'Trebuchet MS', sans-serif" font-size="13" textLength="440" lengthAdjust="spacingAndGlyphs" fill="#8ea3c0">Clinic site for a dentist in Darchula, Nepal.</text>
  <text x="840" y="50" text-anchor="end" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="12" fill="#6b7d96">Next.js &#183; React &#183; Vercel</text>
  <text x="840" y="71" text-anchor="end" font-family="'Century Gothic', Futura, 'Trebuchet MS', sans-serif" font-size="11.5" letter-spacing="1.4" fill="#0ea5e9" opacity=".9">VIEW LIVE</text>
  <g class="ar2" transform="translate(858,30)">
    <path d="M0 10 L10 0" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 0 L10 0 L10 6" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="85" width="900" height="1" fill="#1b2637"/>
</svg>
