<svg xmlns="http://www.w3.org/2000/svg" width="288" height="66" viewBox="0 0 288 66" role="img" aria-label="Tip Calculator">
  <title>Tip Calculator</title>
  <style>
    @keyframes arw2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,-5px); } }
    @keyframes rule2 { 0% { transform: scaleX(0); } 55%,100% { transform: scaleX(1); } }
    .ar2 { animation: arw2 2.1s ease-in-out infinite; }
    .rl2 { transform-origin: 0 0; animation: rule2 6s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0.5s; }
  </style>
  <rect width="288" height="66" fill="#0d1117"/>
  <text x="2" y="30" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="11" fill="#14b8a6" opacity=".85">02</text>
  <text x="30" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" textLength="196" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Tip Calculator</text>
  <text x="30" y="50" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="10" fill="#6b7d96">HTML &#183; CSS &#183; JS</text>
  <g class="ar2" transform="translate(268,14)">
    <path d="M0 9 L9 0" fill="none" stroke="#14b8a6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 0 L9 0 L9 5" fill="none" stroke="#14b8a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="0" y="65" width="288" height="1" fill="#14b8a6" opacity=".22"/>
</svg>
