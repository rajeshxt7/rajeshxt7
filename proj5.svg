<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="Color Palette">
  <title>Color Palette</title>
  <defs>
    <linearGradient id="ps4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pc4"><rect x="4" y="4" width="432" height="152" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes sww4 { 0% { transform: translateX(-220px); } 55%,100% { transform: translateX(440px); } }
    @keyframes arw4 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-4px); } }
    @keyframes brd4 { 0%,100% { stroke-opacity: .30; } 50% { stroke-opacity: .95; } }
    .sw4 { animation: sww4 4.6s cubic-bezier(.4,0,.2,1) infinite; }
    .ar4 { animation: arw4 1.9s ease-in-out infinite; }
    .bd4 { animation: brd4 3.4s ease-in-out infinite; }
  </style>

  <rect width="440" height="160" fill="#0d1117"/>
  <rect x="4" y="4" width="432" height="152" rx="14" fill="#0f1626"/>
  <rect class="bd4" x="4" y="4" width="432" height="152" rx="14" fill="none" stroke="#a855f7" stroke-width="2"/>
  <g clip-path="url(#pc4)">
    <rect class="sw4" x="0" y="4" width="220" height="152" fill="url(#ps4)"/>
  </g>

  <text x="24" y="66" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="46" fill="#a855f7" opacity=".20">05</text>
  <text x="24" y="96" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="25" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Color Palette</text>
  <text x="24" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" textLength="330" lengthAdjust="spacingAndGlyphs" fill="#8ea3c0">Harmonious palettes, click to copy hex.</text>

    <rect x="24" y="124" width="37" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="33" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">HSL</text>
    <rect x="69" y="124" width="31" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="78" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">JS</text>
    <rect x="108" y="124" width="37" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="117" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">CSS</text>

  <g class="ar4" transform="translate(392,22)">
    <path d="M0 14 L14 0" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6 0 L14 0 L14 8" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
