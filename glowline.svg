<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-label="divider">
  <title>glowline</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes run { 0% { transform: translateX(-260px); } 100% { transform: translateX(900px); } }
    .sp { animation: run 3.4s linear infinite; }
  </style>
  <rect width="900" height="8" fill="#0d1117"/>
  <rect x="0" y="3" width="900" height="2" rx="1" fill="url(#g)"/>
  <rect class="sp" x="0" y="2" width="260" height="4" rx="2" fill="url(#s)"/>
</svg>
