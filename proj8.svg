<svg xmlns="http://www.w3.org/2000/svg" width="440" height="160" viewBox="0 0 440 160" role="img" aria-label="Tic Tac Toe">
  <title>Tic Tac Toe</title>
  <defs>
    <linearGradient id="ps7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pc7"><rect x="4" y="4" width="432" height="152" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes sww7 { 0% { transform: translateX(-220px); } 55%,100% { transform: translateX(440px); } }
    @keyframes arw7 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,-4px); } }
    @keyframes brd7 { 0%,100% { stroke-opacity: .30; } 50% { stroke-opacity: .95; } }
    .sw7 { animation: sww7 4.6s cubic-bezier(.4,0,.2,1) infinite; }
    .ar7 { animation: arw7 1.9s ease-in-out infinite; }
    .bd7 { animation: brd7 3.4s ease-in-out infinite; }
  </style>

  <rect width="440" height="160" fill="#0d1117"/>
  <rect x="4" y="4" width="432" height="152" rx="14" fill="#0f1626"/>
  <rect class="bd7" x="4" y="4" width="432" height="152" rx="14" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <g clip-path="url(#pc7)">
    <rect class="sw7" x="0" y="4" width="220" height="152" fill="url(#ps7)"/>
  </g>

  <text x="24" y="66" font-family="Tahoma, Geneva, Verdana, sans-serif" font-size="46" fill="#22d3ee" opacity=".20">08</text>
  <text x="24" y="96" font-family="Tahoma, Geneva, Verdana, sans-serif" font-size="25" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Tic Tac Toe</text>
  <text x="24" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" textLength="330" lengthAdjust="spacingAndGlyphs" fill="#8ea3c0">Play against a smart little AI.</text>

    <rect x="24" y="124" width="31" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="33" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">JS</text>
    <rect x="63" y="124" width="70" height="21" rx="10" fill="#151f31" stroke="#263349" stroke-width="1"/>
    <text x="72" y="139" font-family="Consolas, Menlo, monospace" font-size="11" fill="#a9b6c9">CSS Grid</text>

  <g class="ar7" transform="translate(392,22)">
    <path d="M0 14 L14 0" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6 0 L14 0 L14 8" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
